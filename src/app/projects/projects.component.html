<section class="section">
  <h1>Projects</h1>

  <div class="projects">
    @for (project of projects; track $index) {
      <div class="project">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <p class="tech"><strong>Tech:</strong> {{ project.tech }}</p>
      </div>
    }
  </div>
</section>
